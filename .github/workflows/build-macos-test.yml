name: Build macOS Test Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS DMG (Artifact Only)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run SSO Login & Network Test
        run: flutter test test/login_test.dart

      - name: Build macOS App
        run: flutter build macos --release

      - name: Sign app with entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "App path: $APP_PATH"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP_PATH"

      - name: Verify entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "=== Entitlements ==="
          codesign -d --entitlements :- "$APP_PATH"
          echo "=== Signature info ==="
          codesign -dv "$APP_PATH"

      - name: Verify compiled macOS App binary launch & network socket access
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "🚀 啟動簽名後的 .app 執行檔: $APP_PATH"
          "$APP_PATH/Contents/MacOS/NSYSU" &
          APP_PID=$!
          sleep 5

          if kill -0 $APP_PID 2>/dev/null; then
            echo "✅ 簽名後的 .app 進程 (PID: $APP_PID) 成功啟動並保持運行！"
            echo "🔍 正在透過 macOS lsof 檢查該 App 進程開闢的系統資源與網路權限..."
            lsof -p $APP_PID || true
            echo "=================================================="
            echo "✅ macOS 作業系統未限制該 App 進程，網路與系統權限正常開放！"
            echo "=================================================="
            kill -9 $APP_PID || true
          else
            echo "❌ App 啟動失敗或閃退"
            exit 1
          fi

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create DMG
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          mkdir -p dist
          hdiutil create -format UDZO -srcfolder "$APP_PATH" "dist/NSYSU-${VERSION}-macOS-Test.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-dmg
          path: dist/NSYSU-*-macOS-Test.dmg
          if-no-files-found: error
