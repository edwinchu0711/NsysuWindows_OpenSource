name: NSYSU-Desktop-Build-and-Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: bash
        run: |
          RAW_VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "RAW_VERSION=$RAW_VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=v$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Compile Inno Setup Script
        shell: powershell
        run: |
          $RAW_VERSION = "${{ steps.get_version.outputs.RAW_VERSION }}"
          iscc "/DMyAppVersion=$RAW_VERSION" installer_windows/NSYSU_installer.iss

      - name: Prepare Windows Installer File
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist
          cp build/windows/installer/NSYSU-Windows-Setup.exe "dist/NSYSU-${VERSION}-Windows-Setup.exe"

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/NSYSU-*-Windows-Setup.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run macOS Login & Network Integration Test
        run: flutter test test/login_test.dart

      - name: Build macOS App
        run: flutter build macos --release

      - name: Sign app with entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "App path: $APP_PATH"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP_PATH"

      - name: Verify entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "=== Entitlements ==="
          codesign -d --entitlements :- "$APP_PATH"
          echo "=== Signature info ==="
          codesign -dv "$APP_PATH"

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create DMG
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          mkdir -p dist
          hdiutil create -format UDZO -srcfolder "$APP_PATH" "dist/NSYSU-${VERSION}-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/NSYSU-*-macOS.dmg
          if-no-files-found: error

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Version from pubspec.yaml
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=v$VERSION" >> $GITHUB_OUTPUT

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ steps.get_version.outputs.VERSION }}
          overwrite: true
          body: |
            ## 📦 桌面版軟體下載 (Desktop Releases)

            * **Windows 安裝包**: `NSYSU-${{ steps.get_version.outputs.VERSION }}-Windows-Setup.exe`
            * **macOS 安裝檔**: `NSYSU-${{ steps.get_version.outputs.VERSION }}-macOS.dmg`

            ---

            ## ⚠️ 安裝時遇到警告怎麼辦？

            因為目前軟體沒有經過官方付費簽章認證，兩個平台第一次安裝時都可能會跳出安全警告，屬於正常現象，請依照以下步驟操作。

            ###  macOS 安裝步驟

            1. 下載並打開 DMG，把 App 拖曳到「Applications」（應用程式）資料夾。
            2. **第一次打開請勿雙擊**：在「應用程式」資料夾中，**滑鼠右鍵點擊**（或按住 Control 點擊）NSYSU 圖示，選擇「**打開**」，跳出警告視窗後點擊「**打開**」確認。
            3. 若右鍵打開仍被封鎖：前往「系統設定」→「隱私權與安全性」，往下捲動找到「NSYSU 已被封鎖」的提示，點擊「**強制打開**」，輸入密碼確認即可。
            4. 之後即可直接雙擊開啟，僅第一次需要上述操作。

            ###  Windows 安裝步驟

            1. 下載並執行 `NSYSU-Setup.exe`。
            2. 若出現「**Windows 已保護您的電腦**」（SmartScreen）藍色警告視窗：點擊視窗中的「**其他資訊**」（More info），再點擊下方出現的「**仍要執行**」（Run anyway）按鈕即可繼續安裝。
            3. 若被防毒軟體（如 Windows Defender、其他防毒軟體）攔截或誤判為風險：可將安裝檔加入防毒軟體的例外清單，或允許此次執行。

            ---

            *Desktop 自動建置系統 - 版本號: ${{ steps.get_version.outputs.VERSION }}*
            *Commit: ${{ github.sha }}*
