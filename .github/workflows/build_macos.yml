name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      # 新增：強制 ad-hoc 簽章並套用 entitlements
      - name: Sign app with entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "App path: $APP_PATH"
          codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$APP_PATH"

      # 新增：驗證 entitlements 是否真的簽進去了，方便你直接在 log 裡檢查
      - name: Verify entitlements
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          echo "=== Entitlements ==="
          codesign -d --entitlements :- "$APP_PATH"
          echo "=== Signature info ==="
          codesign -dv "$APP_PATH"

      # 轉換為 DMG 安裝包
      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -1)
          hdiutil create -format UDZO -srcfolder "$APP_PATH" build/macos/Build/Products/Release/macOS-App.dmg

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-App-DMG
          path: build/macos/Build/Products/Release/macOS-App.dmg
          if-no-files-found: error